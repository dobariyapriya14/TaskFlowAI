name: Android Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          bundler: latest

      - name: Install npm dependencies
        run: npm ci

      - name: Generate mock google-services.json
        run: |
          cat <<EOF > android/app/google-services.json
          {
            "project_info": { "project_number": "1", "project_id": "mock" },
            "client": [
              {
                "client_info": { "mobilesdk_app_id": "1:1:android:1", "android_client_info": { "package_name": "com.taskflowai" } },
                "api_key": [ { "current_key": "mock" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run Fastlane
        working-directory: android
        run: bundle exec fastlane build
