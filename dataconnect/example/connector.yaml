connectorId: example
generate:
  kotlinSdk:
    - outputDir: ../../android/app/src/main/kotlin
      package: com.google.firebase.dataconnect.generated
      clientCache: {}
  swiftSdk:
    - outputDir: ../../FirebaseDataConnectGenerated
      package: DataConnectGenerated
      clientCache: {}
    - outputDir: ../../ios/FirebaseDataConnectGenerated
      package: DataConnectGenerated
      clientCache: {}
  javascriptSdk:
    - outputDir: ../../src/dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ../..
      react: true
      angular: false
      clientCache: {}
  adminNodeSdk:
    - outputDir: ../../taskflow/src/dataconnect-admin-generated
      package: "@dataconnect/admin-generated"
      packageJsonDir: ../../taskflow
    - outputDir: ../../functions/src/dataconnect-admin-generated
      package: "@dataconnect/admin-generated"
      packageJsonDir: ../../functions
